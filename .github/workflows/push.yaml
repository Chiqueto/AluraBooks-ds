name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Permissão para criar tags/releases
      pull-requests: write
      issues: write
    
    if: "!contains(github.event.head_commit.message, 'ci skip') && !contains(github.event.head_commit.message, 'skip ci')"
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necessário para o auto detectar mudanças
          persist-credentials: false  # Crucial para autenticação
      
      - name: Prepare repository
        run: git fetch --tags
      
      - name: Use Node.js 16.x
        uses: actions/setup-node@v3
        with:
          node-version: 16.x
          registry-url: 'https://registry.npmjs.org'
      
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            .yarn/cache
          key: yarn-deps-${{ hashFiles('yarn.lock') }}
      
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      
      - name: Build
        run: yarn build
      
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # auto usa GH_TOKEN por padrão
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Configuração necessária para o git
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # Força a atualização das tags remotas
          git tag -d $(git tag -l)
          git fetch --tags
          
          # Executa o release
          yarn auto shipit --base-branch=main